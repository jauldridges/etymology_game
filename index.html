<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Roots</title>
  <meta name="description" content="Find every word that grows from one ancient root.">
  <link rel="stylesheet" href="src/ui/game.css">
  <style>html, body { margin: 0; height: 100%; } body { background: #f7f3ea; } @media (prefers-color-scheme: dark) { body { background: #1c1a17; } }</style>
</head>
<body>
  <div id="app"></div>
  <script>
    // Opened straight from disk, browsers block the game's modules and word lists.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML = '<p style="font-family: Georgia, serif; font-size: 18px; max-width: 30em; margin: 40px auto; padding: 0 16px">This page needs a local server. To play without one, open <a href="play.html"><b>play.html</b></a> instead. Or run <code>npm run serve</code> and visit http://localhost:8080.</p>';
    }
  </script>
  <script type="module">
    import { mountGame } from './src/ui/game.js';
    mountGame(document.getElementById('app'), { keysUrl: './keys/' });
  </script>
</body>
</html>
